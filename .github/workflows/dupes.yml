name: Duplicate Check

# jscpd is offline and deterministic, so it runs in CI on every main push to
# keep the no-duplication rule enforced. The grinder workflow writes data and
# needs the chain; this one needs neither.
on:
  push:
    branches: [main]

# Harden installs against transient registry blips like ECONNRESET: retry more
# times over a longer backoff window than npm's default of 2. npm and pnpm both
# read these npm_config_* values.
env:
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_mintimeout: "20000"
  npm_config_fetch_retry_maxtimeout: "120000"
  npm_config_fetch_timeout: "600000"

jobs:

  dupes:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version: 26
    - run: npm ci
    - run: npm run dupes
